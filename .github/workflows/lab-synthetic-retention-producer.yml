#
# LAB ONLY - NOT PART OF THE PRODUCT.  This branch holds nothing else that can run.
#
# Same file name as the workflow on the fork's default branch, because GitHub only
# offers workflow_dispatch for a file that exists there.  It runs only when dispatched
# by hand against this branch; a push starts nothing.
#
# Every test is synthetic: xcrun, codesign and spctl are simulators, and the only gpg
# keys are the fixtures in tests/.  There is no `environment:` and no reference to any
# secret, and the fork's macos-signing environment accepts only its master branch.
# Nothing here signs, notarizes, publishes or talks to Apple.
#
name: LAB macOS signing reliability (synthetic, no secrets)

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # The system shell, on purpose: production scripts have #!/bin/bash, which is 3.2.
    shell: /bin/bash --noprofile --norc -eo pipefail {0}

jobs:
  rehearsal:
    name: ${{ matrix.arch }} on ${{ matrix.runner }}
    if: github.repository == 'Dkijas/simutrans' && github.ref == 'refs/heads/lab/macos-signing-reliability-01'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    env:
      EXPECT_ARCH: ${{ matrix.arch }}
      EXPECT_BASH_MAJOR: '3'
      JOBS: '3'
    steps:
      # actions/checkout v6.0.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: What this runner is
        run: |
          mkdir -p out
          /bin/bash tests/env-report.sh 2>&1 | tee out/env.txt

      # Every suite is its own step, so that one failure cannot stop the next from
      # running.  The last step decides, from the logs.
      - name: candidate-v2, all checks
        if: always()
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          /bin/bash tests/run-all.sh candidate-v2 base 2>&1 | tee out/v2-run-all.txt

      - name: candidate-v2, isolated validator
        if: always()
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          /bin/bash tests/test-strict.sh candidate-v2 2>&1 | tee out/v2-strict.txt

      - name: Are the manipulated messages what they claim
        if: always()
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          /bin/bash tests/test-glued-structure.sh candidate-v2 2>&1 | tee out/v2-structure.txt

      - name: candidate-v2, negative controls
        if: always()
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          /bin/bash tests/controls.sh candidate-v2 mutants-v2 34 2>&1 | tee out/v2-controls.txt

      - name: Frozen candidate, all checks
        if: always()
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          /bin/bash tests/run-all.sh candidate base 2>&1 | tee out/frozen-run-all.txt

      - name: Frozen candidate, negative controls
        if: always()
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          /bin/bash tests/controls.sh candidate mutants 32 2>&1 | tee out/frozen-controls.txt

      # Expected to report the known gap; the gate checks that it still does.
      - name: Frozen candidate, isolated validator
        if: always()
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          /bin/bash tests/test-strict.sh candidate 2>&1 | tee out/frozen-strict.txt || true

      - name: The unpatched base must show the defects
        if: always()
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          /bin/bash tests/base-repro.sh base 2>&1 | tee out/base-repro.txt

      - name: The harness must be able to fail
        if: always()
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          /bin/bash tests/test-harness.sh 2>&1 | tee out/harness.txt

      - name: Make a container for the other runner
        if: always()
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          /bin/bash tests/cross-gpg.sh make candidate-v2 cross 2>&1 | tee out/cross-make.txt

      - name: Gate
        if: always()
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          /bin/bash tests/gate-macos.sh out 2>&1 | tee out/gate.txt

      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: results-${{ matrix.arch }}
          path: out/
          retention-days: 14

      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cross-${{ matrix.arch }}
          path: cross/
          retention-days: 14
          if-no-files-found: error

  cross:
    name: ${{ matrix.reader }} reads what ${{ matrix.writer }} wrote
    needs: rehearsal
    if: always() && github.repository == 'Dkijas/simutrans' && github.ref == 'refs/heads/lab/macos-signing-reliability-01'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, reader: arm64, writer: x86_64 }
          - { runner: macos-15-intel, reader: x86_64, writer: arm64 }
    steps:
      # actions/checkout v6.0.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cross-${{ matrix.writer }}
          path: incoming
      - name: Read it with candidate-v2
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          mkdir -p out
          /bin/bash tests/cross-gpg.sh read candidate-v2 incoming 2>&1 | tee out/cross-read.txt
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: results-cross-${{ matrix.reader }}
          path: out/
          retention-days: 14
